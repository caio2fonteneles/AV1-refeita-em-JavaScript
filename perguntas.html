
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Perguntas</title>
</head>

<body>

    <h1>Gerenciamento de Perguntas</h1>

    <h2 id="tituloFormulario">Criar Pergunta</h2>

    <form id="formPergunta">

        <input type="hidden" id="id">

        Desafio:
        <br>
        <input type="text" id="desafio" required>

        <br><br>

        Pergunta:
        <br>
        <textarea id="pergunta" required></textarea>

        <br><br>

        Tipo:
        <br>
        <select id="tipo">
            <option value="multipla">Múltipla escolha</option>
            <option value="texto">Texto</option>
        </select>

        <br><br>

        <div id="camposMultipla">

            <h3>Opções</h3>

            Opção 1:
            <input type="text" id="opcao1">

            <br>

            Opção 2:
            <input type="text" id="opcao2">

            <br>

            Opção 3:
            <input type="text" id="opcao3">

            <br>

            Opção 4:
            <input type="text" id="opcao4">

            <br><br>

            Resposta correta:
            <select id="correta">
                <option value="1">Opção 1</option>
                <option value="2">Opção 2</option>
                <option value="3">Opção 3</option>
                <option value="4">Opção 4</option>
            </select>

        </div>

        <div id="camposTexto" hidden>

            <h3>Resposta esperada</h3>

            <textarea id="resposta"></textarea>

        </div>

        <br>

        <button type="submit">Salvar pergunta</button>

        <button type="button" id="cancelarEdicao" hidden>
            Cancelar edição
        </button>

    </form>

    <hr>

    <h2>Perguntas cadastradas</h2>

    <div id="listaPerguntas"></div>

    <div id="detalhePergunta"></div>

    <br>

    <a href="index.html">Voltar ao menu</a>

    <script src="javascript/perguntas.js"></script>

</body>
</html>
